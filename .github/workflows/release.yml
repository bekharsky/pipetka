name: GitHub Release

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.0.12"
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          xcodebuild \
            -quiet \
            -project Pipetka.xcodeproj \
            -scheme Pipetka \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

  release:
    name: Build, notarize, and publish
    needs: test
    runs-on: macos-15

    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          for required in \
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 \
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_PRIVATE_KEY_BASE64
          do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${required}"
              exit 1
            fi
          done

          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="${REQUESTED_VERSION#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n -E \
              's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' \
              Pipetka/Configs/AppInfo.xcconfig \
              | head -n 1)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must look like 1.0.12; got '${version:-empty}'"
            exit 1
          fi

          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=Pipetka-${version}-macOS.zip" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="$RUNNER_TEMP/pipetka-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The imported keychain does not contain a Developer ID Application identity"
            exit 1
          fi

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Archive the non-sandboxed GitHub build
        shell: bash
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Pipetka.xcarchive"
          xcodebuild \
            -quiet \
            -project Pipetka.xcodeproj \
            -scheme Pipetka \
            -configuration Release \
            -sdk macosx \
            -archivePath "$archive_path" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            ENABLE_APP_SANDBOX=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

          app_path="$archive_path/Products/Applications/Pipetka.app"
          codesign --verify --deep --strict "$app_path"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Submit the app for notarization
        shell: bash
        run: |
          set -euo pipefail

          notarization_zip="$RUNNER_TEMP/Pipetka-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notarization_zip"

          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 -D > "$notary_key_path"
          submission_json="$(xcrun notarytool submit "$notarization_zip" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json)"
          printf '%s\n' "$submission_json"

          submission_id="$(printf '%s\n' "$submission_json" | jq -r '.id // empty')"
          submission_status="$(printf '%s\n' "$submission_json" | jq -r '.status // empty')"
          if [[ "$submission_status" != "Accepted" ]]; then
            echo "::error::Apple notarization returned '${submission_status:-unknown}'"
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$notary_key_path" \
                --key-id "$APPLE_NOTARY_KEY_ID" \
                --issuer "$APPLE_NOTARY_ISSUER_ID" || true
            fi
            exit 1
          fi

      - name: Staple and package the notarized app
        shell: bash
        run: |
          set -euo pipefail

          stapled=false
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$APP_PATH" && xcrun stapler validate "$APP_PATH"; then
              stapled=true
              break
            fi
            echo "Stapling is not visible yet; retrying in 10 seconds (attempt $attempt/6)"
            sleep 10
          done
          if [[ "$stapled" != true ]]; then
            echo "::error::Apple accepted the submission, but the notarization ticket could not be stapled"
            exit 1
          fi
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/$ARTIFACT_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; keeping the existing release asset."
          else
            gh release create "$RELEASE_TAG" \
              "$RUNNER_TEMP/$ARTIFACT_NAME" \
              --target "$GITHUB_SHA" \
              --title "Pipetka $MARKETING_VERSION" \
              --generate-notes
          fi

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
